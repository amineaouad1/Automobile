<div class="container mt-4">

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">

      <div class="card shadow-sm">
        <div class="card-header bg-primary text-white">
          <h4 class="mb-0"><i class="bi bi-person-plus me-2"></i>Nouveau Mécanicien</h4>
        </div>

        <div class="card-body p-4">

          <div *ngIf="erreur" class="alert alert-danger">{{ erreur }}</div>

          <form [formGroup]="form" (ngSubmit)="onSubmit()">

            <div class="mb-3">
              <label for="nom" class="form-label">Nom</label>
              <input
                id="nom"
                type="text"
                class="form-control"
                formControlName="nom"
                [class.is-invalid]="f['nom'].invalid && f['nom'].touched"
                placeholder="Ex: Yassine Alaoui">
              <div class="invalid-feedback" *ngIf="f['nom'].invalid && f['nom'].touched">
                Le nom est obligatoire.
              </div>
            </div>

            <div class="mb-4">
              <label for="specialite" class="form-label">Spécialité</label>
              <input
                id="specialite"
                type="text"
                class="form-control"
                formControlName="specialite"
                [class.is-invalid]="f['specialite'].invalid && f['specialite'].touched"
                placeholder="Ex: Mécanique générale, Électricité auto...">
              <div class="invalid-feedback" *ngIf="f['specialite'].invalid && f['specialite'].touched">
                La spécialité est obligatoire.
              </div>
            </div>

            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-outline-secondary" (click)="onAnnuler()">
                Annuler
              </button>
              <button type="submit" class="btn btn-primary" [disabled]="enCours">
                <span *ngIf="enCours" class="spinner-border spinner-border-sm me-2"></span>
                Enregistrer
              </button>
            </div>

          </form>

        </div>
      </div>

    </div>
  </div>

</div>
