<div class="mb-4">
  <a routerLink="/interventions" class="text-decoration-none small text-muted">
    <i class="bi bi-arrow-left me-1"></i>Retour
  </a>
  <h2 class="mt-1">Nouvelle intervention</h2>
</div>

<div class="card" style="max-width: 600px;">
  <div class="card-body p-4">

    <div *ngIf="erreur" class="alert alert-danger">{{ erreur }}</div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="mb-3">
        <label class="form-label">Véhicule *</label>
        <select class="form-select" formControlName="vehiculeId" [class.is-invalid]="f['vehiculeId'].invalid && f['vehiculeId'].touched">
          <option value="" disabled>Sélectionner un véhicule</option>
          <option *ngFor="let v of vehicules" [value]="v.id">
            {{ v.immatriculation }} — {{ v.marque }} {{ v.modele }}
          </option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Type d'intervention *</label>
        <select class="form-select" formControlName="type">
          <option *ngFor="let t of types" [value]="t">{{ t }}</option>
        </select>
      </div>

      <div class="mb-3">
        <label class="form-label">Priorité *</label>
        <select class="form-select" formControlName="priorite">
          <option *ngFor="let p of priorites" [value]="p">{{ p }}</option>
        </select>
      </div>

      <div class="mb-4">
        <label class="form-label">Description du client *</label>
        <textarea
          class="form-control"
          rows="4"
          formControlName="descriptionClient"
          [class.is-invalid]="f['descriptionClient'].invalid && f['descriptionClient'].touched"
          placeholder="Ex: Bruit anormal au freinage"></textarea>
      </div>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-primary" [disabled]="enCours">
          <span *ngIf="enCours" class="spinner-border spinner-border-sm me-2"></span>
          Créer l'intervention
        </button>
        <a routerLink="/interventions" class="btn btn-outline-secondary">Annuler</a>
      </div>

    </form>
  </div>
</div>
