<div class="d-flex align-items-center justify-content-center vh-100" style="background: linear-gradient(135deg, #1e3a5f, #2d5580);">
  <div class="card shadow-lg" style="width: 400px;">
    <div class="card-body p-5">

      <div class="text-center mb-4">
        <i class="bi bi-tools" style="font-size: 2.5rem; color: #1e3a5f;"></i>
        <h3 class="mt-2 mb-0">GarageXpert</h3>
        <p class="text-muted small">Gestion d'atelier automobile</p>
      </div>

      <div *ngIf="erreur" class="alert alert-danger">{{ erreur }}</div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input
            id="email"
            type="email"
            class="form-control"
            formControlName="email"
            [class.is-invalid]="f['email'].invalid && f['email'].touched"
            placeholder="nom@atelier.com">
          <div class="invalid-feedback" *ngIf="f['email'].invalid && f['email'].touched">
            Email invalide.
          </div>
        </div>

        <div class="mb-4">
          <label for="motDePasse" class="form-label">Mot de passe</label>
          <input
            id="motDePasse"
            type="password"
            class="form-control"
            formControlName="motDePasse"
            [class.is-invalid]="f['motDePasse'].invalid && f['motDePasse'].touched">
          <div class="invalid-feedback" *ngIf="f['motDePasse'].invalid && f['motDePasse'].touched">
            Mot de passe obligatoire.
          </div>
        </div>

        <button type="submit" class="btn btn-primary w-100" [disabled]="enCours">
          <span *ngIf="enCours" class="spinner-border spinner-border-sm me-2"></span>
          Se connecter
        </button>
      </form>

    </div>
  </div>
</div>
